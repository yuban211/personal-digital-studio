{% extends 'base.html' %}{% block title %}{{ '编辑文章' if mode=='edit' else '写一篇文章' }} — 后台{% endblock %}{% block content %}<section class="admin-wrap narrow wrap"><a class="back-link" href="{{ prefix }}/admin/">← 返回后台</a><p class="eyebrow">FIELD NOTE EDITOR / {{ mode|upper }}</p><h1>{{ '编辑文章' if mode=='edit' else '写一篇文章' }}<span>.</span></h1><form method="post" action="{{ prefix }}/admin/posts/save" class="editor-form"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="item_id" value="{{ item.get('id',0) }}"><label>文章标题<input name="title" required maxlength="160" value="{{ item.get('title','') }}"></label><label>Slug / URL 标识<input name="slug" maxlength="80" value="{{ item.get('slug','') }}" placeholder="留空则从标题生成"></label><label>摘要<textarea name="summary" rows="2" maxlength="500">{{ item.get('summary','') }}</textarea></label><label>正文（安全 Markdown）<textarea name="body" rows="20" class="code-input">{{ item.get('body','') }}</textarea><small>支持标题、段落、列表、粗体、斜体、代码块与安全外链。文章可以先保存为草稿。</small></label><label>标签（逗号分隔）<input name="tags" maxlength="500" value="{{ item.get('tags','') }}" placeholder="开发, 复盘, 技术"></label><label class="check-label"><input type="checkbox" name="published" value="1" {% if item.get('published') %}checked{% endif %}> 立即发布（取消勾选则保存为草稿）</label><div class="editor-actions"><button class="button-dark" type="submit">保存文章 <span>↗</span></button><a class="text-link" href="{{ prefix }}/admin/">取消</a></div></form></section>{% endblock %}
