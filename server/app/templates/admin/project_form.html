{% extends 'base.html' %}{% block title %}{{ '编辑项目' if mode=='edit' else '新建项目' }} — 后台{% endblock %}{% block content %}<section class="admin-wrap narrow wrap"><a class="back-link" href="{{ prefix }}/admin/">← 返回后台</a><p class="eyebrow">PROJECT EDITOR / {{ mode|upper }}</p><h1>{{ '编辑项目' if mode=='edit' else '新建项目' }}<span>.</span></h1><form method="post" action="{{ prefix }}/admin/projects/save" class="editor-form"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="item_id" value="{{ item.get('id',0) }}"><label>项目名称<input name="title" required maxlength="160" value="{{ item.get('title','') }}"></label><label>Slug / URL 标识<input name="slug" maxlength="80" value="{{ item.get('slug','') }}" placeholder="留空则从标题生成"></label><label>一句话介绍<textarea name="summary" rows="2" maxlength="500">{{ item.get('summary','') }}</textarea></label><label>项目详情（安全 Markdown）<textarea name="body" rows="12" class="code-input">{{ item.get('body','') }}</textarea><small>支持标题、段落、列表、粗体、斜体、行内代码、代码块与 HTTPS/HTTP 链接；不执行任意 HTML。</small></label><div class="form-two"><label>项目状态<input name="status" maxlength="40" value="{{ item.get('status','规划中') }}"></label><label>排序权重<input type="number" name="sort_order" value="{{ item.get('sort_order',0) }}"></label></div><label>在线体验链接<input type="url" name="url" value="{{ item.get('url','') }}" placeholder="https://…"></label><label>源代码链接<input type="url" name="repo_url" value="{{ item.get('repo_url','') }}" placeholder="https://github.com/…"></label><label class="check-label"><input type="checkbox" name="featured" value="1" {% if item.get('featured') %}checked{% endif %}> 在首页精选项目中优先展示</label><div class="editor-actions"><button class="button-dark" type="submit">保存项目 <span>↗</span></button><a class="text-link" href="{{ prefix }}/admin/">取消</a></div></form></section>{% endblock %}
